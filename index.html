<style>
:root{
  --ink:#08202B; --panel:#0E2B38; --panel2:#123543; --rule:#1D4A5C;
  --paper:#DEEAEF; --muted:#7FA3B2; --amber:#F2A65A; --brass:#E8D45A;
  --good:#6FD3C7; --warn:#E7658A;
  --display:'Barlow Condensed', 'Haettenschweiler', 'Arial Narrow', sans-serif;

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--body);font-size:15px;-webkit-text-size-adjust:100%}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* ---------- shell ---------- */
.shell{display:flex;height:100dvh;overflow:hidden}
#map{flex:1;min-width:0;background:#071A23}
.panel{width:392px;flex:none;background:var(--panel);border-left:1px solid var(--rule);display:flex;flex-direction:column;overflow:hidden}

/* ---------- masthead ---------- */
.mast{padding:max(14px,env(safe-area-inset-top)) 16px 12px;border-bottom:1px solid var(--rule);background:
   linear-gradient(var(--panel2),var(--panel2));position:relative;overflow:hidden}
.mast::after{content:"";position:absolute;inset:0;background-image:
   repeating-linear-gradient(90deg,rgba(242,166,90,.16) 0 1px,transparent 1px 100%);
   background-size:11px 100%;opacity:.5;pointer-events:none;
   -webkit-mask-image:linear-gradient(90deg,transparent 55%,#000);mask-image:linear-gradient(90deg,transparent 55%,#000)}
.mast h1{margin:0;font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:.055em;text-transform:uppercase;line-height:1}
.mast h1 span{color:var(--amber)}
.mast p{margin:5px 0 0;font-size:12.5px;color:var(--muted);max-width:31ch;line-height:1.45}

/* ---------- scroll body ---------- */
.scroll{overflow-y:auto;overflow-x:hidden;flex:1;-webkit-overflow-scrolling:touch;padding-bottom:env(safe-area-inset-bottom)}
.block{padding:14px 16px;border-bottom:1px solid var(--rule)}
.eyebrow{font-family:var(--display);text-transform:uppercase;letter-spacing:.14em;font-size:13px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:8px;margin:0 0 10px}
.eyebrow .n{font-family:var(--mono);font-size:11px;color:var(--ink);background:var(--muted);border-radius:2px;padding:1px 5px;font-weight:600}

/* ---------- ring cards ---------- */
.ring{background:var(--panel2);border:1px solid var(--rule);border-left:4px solid var(--rc,var(--amber));border-radius:3px;padding:10px 10px 11px;margin-bottom:9px;position:relative}
.ring .top{display:flex;gap:8px;align-items:flex-start}
.ring .searchwrap{flex:1;min-width:0;position:relative}
input[type=text],input[type=number]{width:100%;background:#0A2532;border:1px solid var(--rule);border-radius:2px;padding:7px 9px;color:var(--paper);font-size:14px}
input::placeholder{color:#5C808F}
input[type=number]{font-family:var(--mono);text-align:right}
.iconbtn{background:transparent;border:1px solid var(--rule);border-radius:2px;color:var(--muted);width:32px;height:34px;flex:none;display:grid;place-items:center;line-height:1}
.iconbtn:hover{color:var(--paper);border-color:var(--muted)}
.iconbtn.armed{color:var(--ink);background:var(--amber);border-color:var(--amber)}
.ring .meta{font-family:var(--mono);font-size:11px;color:var(--muted);margin:7px 0 0;display:flex;justify-content:space-between;gap:8px}
.ring .fields{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}
.field label{display:block;font-family:var(--display);text-transform:uppercase;letter-spacing:.1em;font-size:11.5px;color:var(--muted);margin-bottom:3px}
.unitbox{position:relative}
.unitbox .u{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:11px;color:var(--muted);pointer-events:none}
.unitbox input{padding-right:30px}

/* ---------- autocomplete ---------- */
.ac{position:absolute;z-index:900;left:0;right:0;top:calc(100% + 3px);background:#0A2532;border:1px solid var(--rule);border-radius:2px;max-height:236px;overflow-y:auto;box-shadow:0 12px 28px rgba(0,0,0,.5)}
.ac div{padding:7px 9px;font-size:13.5px;display:flex;justify-content:space-between;gap:10px;cursor:pointer;border-bottom:1px solid rgba(29,74,92,.5)}
.ac div:last-child{border-bottom:0}
.ac div.sel,.ac div:hover{background:var(--amber);color:var(--ink)}
.ac .cc{font-family:var(--mono);font-size:11px;opacity:.75;white-space:nowrap}

.addbtn{width:100%;background:transparent;border:1px dashed var(--rule);color:var(--muted);border-radius:3px;padding:9px;font-family:var(--display);text-transform:uppercase;letter-spacing:.12em;font-size:14px;font-weight:600}
.addbtn:hover{border-color:var(--amber);color:var(--amber)}

/* ---------- controls ---------- */
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:9px;font-size:13px;color:var(--muted)}
.row.off{opacity:.35;pointer-events:none}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:2px;overflow:hidden}
.seg button{background:transparent;border:0;padding:5px 12px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--amber);color:var(--ink);font-weight:600}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;width:150px}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--rule)}
input[type=range]::-moz-range-track{height:2px;background:var(--rule)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--amber);margin-top:-6px}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:var(--amber)}

/* ---------- results ---------- */
.tally{font-family:var(--display);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tally b{color:var(--amber);font-family:var(--mono);font-size:13px;letter-spacing:0}
.note{font-size:12.5px;color:var(--muted);line-height:1.5;background:rgba(242,166,90,.08);border-left:2px solid var(--amber);padding:8px 10px;border-radius:0 2px 2px 0;margin:0 0 10px}
.hit{width:100%;text-align:left;background:var(--panel2);border:1px solid var(--rule);border-radius:3px;padding:9px 10px;margin-bottom:7px;display:block}
.hit:hover{border-color:var(--muted)}
.hit.active{border-color:var(--amber);background:#16404F}
.hit .hd{display:flex;width:100%;align-items:baseline;gap:8px}
.hit .rank{font-family:var(--mono);font-size:11px;color:var(--muted);width:22px;flex:none}
.hit .nm{font-weight:600;font-size:15px;letter-spacing:.005em}
.hit .cn{font-size:12px;color:var(--muted);margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:44%}
.hit .pop{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:30px;margin-top:1px}
.fixstamp{font-family:var(--display);font-size:11px;letter-spacing:.16em;color:var(--ink);background:var(--brass);padding:1px 5px;border-radius:2px;font-weight:700}

/* signature: residual gauge */
.gauge{display:block;position:relative;height:30px;margin:13px 0 0 30px;border-top:1px solid var(--rule)}
.gauge .zero{position:absolute;left:50%;top:2px;bottom:11px;width:1px;background:var(--muted);opacity:.7}
.gauge .lbl{position:absolute;bottom:0;font-family:var(--mono);font-size:9.5px;color:var(--muted);opacity:.8}
.gauge .lbl.l{left:0}.gauge .lbl.c{left:50%;transform:translateX(-50%)}.gauge .lbl.r{right:0}
.gauge .tick{position:absolute;top:8px;width:3px;height:11px;border-radius:1px;transform:translateX(-1.5px);box-shadow:0 0 0 1px rgba(8,32,43,.85)}
.gauge .tick::after{content:attr(data-v);position:absolute;left:50%;transform:translateX(-50%);top:-11px;font-family:var(--mono);font-size:9px;white-space:nowrap;color:inherit}

/* ---------- map bits ---------- */
.leaflet-container{background:#071A23;font-family:var(--body)}
#map.dim .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.88) saturate(.75)}
.leaflet-container .leaflet-bar a,.leaflet-container .leaflet-bar a:hover{background:var(--panel2);color:var(--paper);border-bottom-color:var(--rule);border-color:var(--rule)}
.leaflet-container .leaflet-bar{border:1px solid var(--rule);box-shadow:none}
.leaflet-control-attribution{background:rgba(8,32,43,.82)!important;color:var(--muted)!important;font-size:10px!important}
.leaflet-control-attribution a{color:var(--muted)!important}
.ctr-dot{border-radius:50%;border:2px solid var(--ink);box-shadow:0 0 0 1px currentColor}
.fix-pin{width:16px;height:16px;border-radius:50%;background:var(--brass);border:3px solid var(--ink);box-shadow:0 0 0 2px var(--brass),0 0 14px rgba(232,212,90,.8)}
.maphint{position:absolute;z-index:800;left:50%;transform:translateX(-50%);top:12px;background:var(--amber);color:var(--ink);font-family:var(--display);text-transform:uppercase;letter-spacing:.12em;font-weight:600;font-size:13px;padding:6px 14px;border-radius:2px;display:none}
.maphint.on{display:block}
.fitbtn{position:absolute;z-index:800;left:12px;bottom:24px;background:var(--panel2);border:1px solid var(--rule);color:var(--paper);
  font-family:var(--display);text-transform:uppercase;letter-spacing:.12em;font-size:13px;font-weight:600;padding:7px 13px;border-radius:2px}
.fitbtn:hover{border-color:var(--amber);color:var(--amber)}
.offline{position:absolute;z-index:800;right:12px;top:12px;max-width:236px;background:var(--panel2);border:1px solid var(--rule);
  border-left:3px solid var(--amber);color:var(--muted);font-size:12px;line-height:1.4;padding:8px 10px;border-radius:2px;display:none}
.offline.on{display:block}
.mapwrap{position:relative;flex:1;min-width:0;display:flex}

@media (max-width:860px){
  .shell{flex-direction:column;height:100dvh}
  .panel{width:100%;border-left:0;border-top:1px solid var(--rule);order:2;flex:1;min-height:0}
  .mapwrap{order:1;flex:none;height:42dvh}
  .mast h1{font-size:26px}
  .mast{padding:max(11px,env(safe-area-inset-top)) 16px 10px}
  .mast p{font-size:12px;max-width:none}
  .mapwrap{height:38dvh}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="shell">
  <div class="mapwrap">
    <div id="map"></div>
    <div class="maphint" id="maphint">Tap the map to place this centre</div>
    <button class="fitbtn" id="fitbtn">Fit rings</button>
    <div class="offline" id="offline">No map tiles — you're offline. Rings and candidates still work.</div>
  </div>

  <aside class="panel">
    <div class="mast">
      <h1>Ring<span>fix</span></h1>
      <p>Plot a distance ring around each clue city. Where the rings agree, you have your answer.</p>
    </div>

    <div class="scroll">
      <div class="block">
        <p class="eyebrow"><span class="n" id="ringcount">0</span> Rings</p>
        <div id="rings"></div>
        <button class="addbtn" id="addring">+ Add a ring</button>
        <div class="row">
          <span>Basemap</span>
          <span class="seg" id="baseseg">
            <button data-b="dark" aria-pressed="true">Dark</button>
            <button data-b="streets" aria-pressed="false">Streets</button>
            <button data-b="terrain" aria-pressed="false">Terrain</button>
          </span>
        </div>
        <div class="row">
          <span>Search among</span>
          <span class="seg" id="scopeseg">
            <button data-s="caps" aria-pressed="true">Capitals</button>
            <button data-s="all" aria-pressed="false">All cities</button>
          </span>
        </div>
        <div class="row">
          <span>Units</span>
          <span class="seg" id="unitseg">
            <button data-u="km" aria-pressed="true">km</button>
            <button data-u="mi" aria-pressed="false">miles</button>
          </span>
        </div>
        <div class="row off" id="poprow">
          <span>Smallest city<br><span style="font-size:11.5px">Population <b id="popval" style="font-family:var(--mono);color:var(--paper)">50k</b></span></span>
          <input type="range" id="popslider" min="0" max="7" step="1" value="0">
        </div>
      </div>

      <div class="block">
        <p class="eyebrow" style="justify-content:space-between">
          <span>Candidates</span>
          <span class="tally" id="tally"></span>
        </p>
        <div id="results"></div>
      </div>
    </div>
  </aside>
</div>

<script>
/* ============ data ============ */
const COUNTRY = {};
document.getElementById('countrydata').textContent.trim().split('\n').forEach(l=>{
  const [c,n]=l.split('|'); COUNTRY[c]=n;
});
const ckey = c => c.n+'|'+c.c+'|'+c.lat;
const fold = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()
  .replace(/\bst\.?\s/g,'saint ').replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim();
const CITIES = document.getElementById('citydata').textContent.trim().split('\n').map(l=>{
  const p=l.split('|');
  return {n:p[0], c:p[1], lat:+p[2], lon:+p[3], pop:+p[4]*1000, k:fold(p[0])};
});

// alternate English names people use for clue cities, so the search box finds them
const ALIASES=[['Ulaanbaatar','Ulan Bator','MN'],['Naypyidaw','Nay Pyi Taw','MM'],
  ['Bombay','Mumbai','IN'],['Saigon','Ho Chi Minh City','VN'],['Rangoon','Yangon','MM'],
  ['Cologne','Koln','DE'],['Gothenburg','Goteborg','SE'],['Kiev','Kyiv','UA'],
  ['Peking','Beijing','CN'],['Bangalore','Bengaluru','IN'],['Calcutta','Kolkata','IN'],
  ['Madras','Chennai','IN'],['Washington DC','Washington','US']];

// national capitals (plus legislative/administrative seats where a country has more than one)
(function(){
  const idx=new Map();
  CITIES.forEach((c,i)=>{ const k=c.n+'|'+c.c; (idx.get(k)||idx.set(k,[]).get(k)).push(i); });
  document.getElementById('capdata').textContent.trim().split('\n').forEach(l=>{
    const p=l.split('|'), n=p[0], cc=p[1], lat=+p[2], lon=+p[3], pop=+p[4]*1000;
    const cand=idx.get(n+'|'+cc);
    if(cand){
      let best=cand[0], bd=Infinity;
      cand.forEach(i=>{ const d=Math.abs(CITIES[i].lat-lat)+Math.abs(CITIES[i].lon-lon); if(d<bd){bd=d;best=i;} });
      CITIES[best].cap=1;
    } else {
      CITIES.push({n, c:cc, lat, lon, pop, k:fold(n), cap:1});
    }
  });
  ALIASES.forEach(([alt,canon,cc])=>{
    const f=fold(canon), t=CITIES.find(c=>c.c===cc && c.k===f);
    if(t) t.k += ' '+fold(alt);
  });
  CITIES.sort((a,b)=>b.pop-a.pop);
})();

/* ============ geodesy ============ */
const R=6371.0088, D2R=Math.PI/180, R2D=180/Math.PI;
function haversine(a1,o1,a2,o2){
  const dLat=(a2-a1)*D2R, dLon=(o2-o1)*D2R;
  const s=Math.sin(dLat/2)**2 + Math.cos(a1*D2R)*Math.cos(a2*D2R)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.min(1,Math.sqrt(s)));
}
function destination(lat,lon,brgDeg,dKm){
  const d=dKm/R, b=brgDeg*D2R, l1=lat*D2R, o1=lon*D2R;
  const l2=Math.asin(Math.sin(l1)*Math.cos(d)+Math.cos(l1)*Math.sin(d)*Math.cos(b));
  const o2=o1+Math.atan2(Math.sin(b)*Math.sin(d)*Math.cos(l1), Math.cos(d)-Math.sin(l1)*Math.sin(l2));
  return [l2*R2D, o2*R2D];
}
// true geodesic ring, longitudes unwrapped so it draws across the antimeridian and around poles
function ringPath(lat,lon,km,steps=288){
  if(km<=0) return [[lat,lon]];
  const pts=[]; let prev=null;
  for(let i=0;i<=steps;i++){
    let [la,lo]=destination(lat,lon,i*360/steps,km);
    if(prev!==null){ while(lo-prev>180) lo-=360; while(lo-prev<-180) lo+=360; }
    prev=lo; pts.push([la,lo]);
  }
  return pts;
}
const shift=(p,dx)=>p.map(([a,o])=>[a,o+dx]);

/* ============ units ============ */
const KM_PER_MI=1.609344;
let unit='km';
const toU = km => unit==='km' ? km : km/KM_PER_MI;
const toKm = v => unit==='km' ? v : v*KM_PER_MI;
const fmtU = km => Math.round(toU(km)).toLocaleString('en-AU')+' '+unit;
const fmtPop = p => p>=1e6 ? (p/1e6).toFixed(p>=1e7?0:1)+'M' : p>=500 ? Math.round(p/1000)+'k' : '—';

/* ============ state ============ */
const PALETTE=['#F2A65A','#6FD3C7','#E7658A','#9BC15A','#A995E8','#E8D45A','#5AB2F2','#F28E5A'];
let fitTimer=null;
let rings=[], nextId=1, armed=null, activeKey=null, minPop=50000, capsOnly=true;
let matches=[], exact=true;

/* ============ map ============ */
const map=L.map('map',{worldCopyJump:true,zoomControl:true,minZoom:1}).setView([10,20],2);
// Basemaps that need no API key. CARTO was dropped in Sep 2026 when it began
// requiring a key and stamping tiles with an "API KEY REQUIRED" watermark.
const BASEMAPS=[
  {id:'dark', label:'Dark',
   url:'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}',
   attribution:'Esri, HERE, Garmin, &copy; OpenStreetMap contributors',
   maxNativeZoom:16, maxZoom:19, dim:false},
  {id:'streets', label:'Streets',
   url:'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
   attribution:'&copy; OpenStreetMap contributors',
   maxNativeZoom:19, maxZoom:19, dim:true},
  {id:'terrain', label:'Terrain',
   url:'https://tile.opentopomap.org/{z}/{x}/{y}.png',
   attribution:'&copy; OpenStreetMap contributors, SRTM | OpenTopoMap (CC-BY-SA)',
   maxNativeZoom:16, maxZoom:19, dim:true}
];
let tiles=null, baseIdx=0, tileFails=0, tileOk=false, autoTried=false;

function setBasemap(i,auto){
  const b=BASEMAPS[i]; if(!b) return;
  baseIdx=i; tileFails=0; tileOk=false;
  if(tiles) map.removeLayer(tiles);
  tiles=L.tileLayer(b.url,{attribution:b.attribution,maxNativeZoom:b.maxNativeZoom,maxZoom:b.maxZoom})
        .addTo(map);
  tiles.setZIndex(1);
  document.getElementById('map').classList.toggle('dim', !!b.dim);
  document.querySelectorAll('#baseseg button').forEach(x=>x.setAttribute('aria-pressed', x.dataset.b===b.id));
  const note=document.getElementById('offline');
  note.classList.remove('on');
  tiles.on('tileload',()=>{ tileOk=true; note.classList.remove('on'); });
  tiles.on('tileerror',()=>{
    if(tileOk || ++tileFails<=4) return;
    // one silent hop to the next basemap before blaming the connection
    if(!autoTried && i+1<BASEMAPS.length){ autoTried=true; setBasemap(i+1,true); return; }
    note.textContent = (navigator.onLine===false)
      ? "No map tiles — you're offline. Rings and candidates still work."
      : "Map tiles aren't loading. Try another basemap above — rings and candidates still work.";
    note.classList.add('on');
  });
}
const ringLayer=L.layerGroup().addTo(map);
const hitLayer=L.layerGroup().addTo(map);

let userMoved=false;
map.on('movestart zoomstart', e=>{ if(!fitting) userMoved=true; });
let fitting=false;
function fitRings(force){
  const live=rings.filter(r=>r.lat!=null);
  if(!live.length || (userMoved && !force)) return;
  let b=null;
  live.forEach(r=>{
    const pts = r.dist>0 ? ringPath(r.lat,r.lon,Math.min(r.dist+r.tol,19500),64) : [[r.lat,r.lon]];
    pts.forEach(pt=>{ b = b ? b.extend(pt) : L.latLngBounds(pt,pt); });
  });
  if(!b) return;
  fitting=true;
  map.fitBounds(b,{padding:[28,28],maxZoom:9,animate:false});
  setTimeout(()=>{fitting=false;},60);
  if(force) userMoved=false;
}
document.getElementById('fitbtn').onclick=()=>fitRings(true);

map.on('click', e=>{
  if(armed===null) return;
  const r=rings.find(x=>x.id===armed); if(!r) return;
  r.lat=+e.latlng.lat.toFixed(4);
  r.lon=+((e.latlng.lng+540)%360-180).toFixed(4);
  r.name='Custom point';
  armed=null; document.getElementById('maphint').classList.remove('on');
  renderRings(); recompute(); userMoved=false; fitRings();
});

function drawRings(){
  ringLayer.clearLayers();
  rings.forEach(r=>{
    if(r.lat==null) return;
    L.marker([r.lat,r.lon],{icon:L.divIcon({className:'',html:
      `<div class="ctr-dot" style="width:9px;height:9px;background:${r.col};color:${r.col}"></div>`,
      iconSize:[9,9],iconAnchor:[4.5,4.5]}),
      keyboard:false}).addTo(ringLayer).bindTooltip(`${r.name} — ${fmtU(r.dist)}`,{direction:'top'});
    if(r.dist<=0) return;
    [[r.dist-r.tol,1,'4 5'],[r.dist,2.2,null],[r.dist+r.tol,1,'4 5']].forEach(([d,w,dash])=>{
      if(d<=0||d>20015) return;
      const base=ringPath(r.lat,r.lon,d);
      [-360,0,360].forEach(dx=>{
        L.polyline(shift(base,dx),{color:r.col,weight:w,opacity:dash?0.55:0.95,
          dashArray:dash,interactive:false,smoothFactor:1}).addTo(ringLayer);
      });
    });
  });
}

/* ============ solve ============ */
function recompute(){
  const live=rings.filter(r=>r.lat!=null && r.dist>0);
  drawRings();
  const res=document.getElementById('results'), tally=document.getElementById('tally');
  matches=[];
  if(live.length===0){
    res.innerHTML='<p class="note">Add a ring: pick the city your clue is measured from, then type how far away the mystery city is.</p>';
    tally.textContent=''; hitLayer.clearLayers(); return;
  }
  const scored=[];
  for(const c of CITIES){
    if(capsOnly ? !c.cap : c.pop<minPop) continue;
    let worst=0, resid=[];
    for(const r of live){
      const d=haversine(r.lat,r.lon,c.lat,c.lon);
      const e=d-r.dist;
      resid.push({e, tol:r.tol, col:r.col, d});
      const n=Math.abs(e)/r.tol;
      if(n>worst) worst=n;
      if(worst>6) break;
    }
    if(resid.length===live.length && worst<=6) scored.push({c,worst,resid});
  }
  scored.sort((a,b)=>a.worst-b.worst);
  exact = scored.length>0 && scored[0].worst<=1;
  matches = exact ? scored.filter(s=>s.worst<=1).slice(0,80) : scored.slice(0,15);
  tally.innerHTML = exact ? `<b>${matches.length}${matches.length===80?'+':''}</b> ${capsOnly?'capitals':'cities'} in every ring`
                          : (scored.length?'no exact fit':'nothing close');
  renderResults(live.length);
  drawHits();
}

function drawHits(){
  hitLayer.clearLayers();
  matches.slice(0,80).forEach((m,i)=>{
    const key=ckey(m.c);
    const on = activeKey===key;
    const mk=L.marker([m.c.lat,m.c.lon],{icon:L.divIcon({className:'',html:
      on ? '<div class="fix-pin"></div>'
         : `<div class="ctr-dot" style="width:${i===0?11:8}px;height:${i===0?11:8}px;background:${i===0?'#E8D45A':'#DEEAEF'};color:#DEEAEF;opacity:${i===0?1:.85}"></div>`,
      iconSize:[on?16:10,on?16:10],iconAnchor:[on?8:5,on?8:5]})}).addTo(hitLayer);
    mk.bindTooltip(`${m.c.n}, ${COUNTRY[m.c.c]||m.c.c}`,{direction:'top'});
    mk.on('click',()=>select(key,m));
  });
}

function select(key,m){
  activeKey = activeKey===key ? null : key;
  if(activeKey) map.flyTo([m.c.lat,m.c.lon], Math.max(map.getZoom(),5),{duration:.7});
  renderResults(rings.filter(r=>r.lat!=null&&r.dist>0).length);
  drawHits();
}

function renderResults(nLive){
  const res=document.getElementById('results');
  let html='';
  if(!exact){
    html += matches.length
      ? `<p class="note">No city sits inside all ${nLive} rings. These come closest — widen a “give or take” or check a distance.</p>`
      : `<p class="note">Nothing within reach of these rings. Check the distances and units${capsOnly?', or switch to all cities':', or lower the population floor'}.</p>`;
  } else if(matches.length>12){
    html += `<p class="note">Plenty of candidates still. Add another clue ring, or tighten “give or take”.</p>`;
  }
  matches.forEach((m,i)=>{
    const key=ckey(m.c);
    const ticks=m.resid.map(r=>{
      const clamped=Math.max(-1.15,Math.min(1.15,r.e/r.tol));
      const pos=50+clamped*47;
      const sign=r.e>=0?'+':'−';
      return `<span class="tick" style="left:${pos}%;background:${r.col};color:${r.col}" data-v="${sign}${Math.round(Math.abs(toU(r.e)))}"></span>`;
    }).join('');
    const tolLbl = m.resid[0] ? fmtU(m.resid[0].tol) : '';
    html+=`<button class="hit ${activeKey===key?'active':''}" data-key="${key}" data-i="${i}">
      <span class="hd">
        <span class="rank">${String(i+1).padStart(2,'0')}</span>
        <span class="nm">${m.c.n}</span>
        ${i===0&&exact?'<span class="fixstamp">Best fit</span>':''}
        <span class="cn">${COUNTRY[m.c.c]||m.c.c}</span>
      </span>
      <span class="pop">pop ${fmtPop(m.c.pop)} · ${m.resid.map(r=>fmtU(r.d)).join(' · ')}</span>
      <span class="gauge">
        <span class="zero"></span>${ticks}
        <span class="lbl l">short</span><span class="lbl c">on the ring</span><span class="lbl r">long</span>
      </span>
    </button>`;
  });
  res.innerHTML=html;
  res.querySelectorAll('.hit').forEach(b=>b.onclick=()=>{
    const m=matches[+b.dataset.i]; select(b.dataset.key,m);
  });
}

/* ============ ring UI ============ */
function addRing(){
  rings.push({id:nextId++, name:'', lat:null, lon:null, dist:0, tol:25, col:PALETTE[(rings.length)%PALETTE.length]});
  renderRings();
  requestAnimationFrame(()=>{
    const inputs=document.querySelectorAll('.ring .searchwrap input');
    if(inputs.length) inputs[inputs.length-1].focus();
  });
}

function renderRings(){
  const wrap=document.getElementById('rings');
  document.getElementById('ringcount').textContent=rings.length;
  wrap.innerHTML=rings.map(r=>`
    <div class="ring" style="--rc:${r.col}" data-id="${r.id}">
      <div class="top">
        <div class="searchwrap">
          <input type="text" class="csearch" placeholder="Centre city or “lat, lon”" value="${r.name?r.name.replace(/"/g,'&quot;'):''}" autocomplete="off" spellcheck="false">
        </div>
        <button class="iconbtn pick ${armed===r.id?'armed':''}" title="Place this centre by tapping the map">⌖</button>
        <button class="iconbtn del" title="Remove this ring">×</button>
      </div>
      <div class="fields">
        <div class="field"><label>Distance</label>
          <div class="unitbox"><input type="number" inputmode="decimal" class="dist" min="0" step="1" value="${r.dist?+toU(r.dist).toFixed(1):''}" placeholder="0"><span class="u">${unit}</span></div>
        </div>
        <div class="field"><label>Give or take</label>
          <div class="unitbox"><input type="number" inputmode="decimal" class="tol" min="1" step="1" value="${+toU(r.tol).toFixed(1)}"><span class="u">±${unit}</span></div>
        </div>
      </div>
      <p class="meta"><span>${r.lat!=null?`${r.lat.toFixed(3)}, ${r.lon.toFixed(3)}`:'no centre set'}</span></p>
    </div>`).join('');

  wrap.querySelectorAll('.ring').forEach(el=>{
    const id=+el.dataset.id, r=rings.find(x=>x.id===id);
    el.querySelector('.del').onclick=()=>{ rings=rings.filter(x=>x.id!==id); if(armed===id)armed=null; renderRings(); recompute(); fitRings(); };
    el.querySelector('.pick').onclick=()=>{ armed = armed===id?null:id;
      document.getElementById('maphint').classList.toggle('on',armed!==null); renderRings(); };
    el.querySelector('.dist').oninput=e=>{ r.dist=Math.max(0,toKm(+e.target.value||0)); recompute(); clearTimeout(fitTimer); fitTimer=setTimeout(fitRings,700); };
    el.querySelector('.tol').oninput=e=>{ r.tol=Math.max(1,toKm(+e.target.value||1)); recompute(); };
    attachSearch(el.querySelector('.csearch'), r);
  });
}

function attachSearch(input,r){
  const wrap=input.parentElement;
  let list=[], sel=0, box=null;
  const close=()=>{ if(box){box.remove(); box=null;} };
  const coord=v=>{ const m=v.trim().match(/^(-?\d+(?:\.\d+)?)\s*[, ]\s*(-?\d+(?:\.\d+)?)$/);
    return m && Math.abs(+m[1])<=90 && Math.abs(+m[2])<=180 ? [+m[1],+m[2]] : null; };
  const choose=c=>{ r.name=c.n; r.lat=c.lat; r.lon=c.lon; input.value=c.n; close(); recompute(); renderRings(); userMoved=false; fitRings(); };

  input.oninput=()=>{
    const v=input.value.trim(); close();
    const meta=input.closest('.ring').querySelector('.meta span');
    if(!v){ r.lat=null; r.lon=null; r.name=''; if(meta) meta.textContent='no centre set'; recompute(); return; }
    const cc=coord(v);
    if(cc){ r.lat=cc[0]; r.lon=cc[1]; r.name=`${cc[0].toFixed(2)}, ${cc[1].toFixed(2)}`;
            if(meta) meta.textContent=`${r.lat.toFixed(3)}, ${r.lon.toFixed(3)}`; recompute(); return; }
    if(v.length<2) return;
    const q=fold(v);
    list=[];
    for(const c of CITIES){ if(c.k.startsWith(q)){ list.push(c); if(list.length>=7) break; } }
    if(list.length<7) for(const c of CITIES){ if(!c.k.startsWith(q)&&c.k.includes(q)){ list.push(c); if(list.length>=7) break; } }
    if(!list.length) return;
    sel=0;
    box=document.createElement('div'); box.className='ac';
    box.innerHTML=list.map((c,i)=>`<div class="${i===0?'sel':''}" data-i="${i}"><span>${c.n}</span><span class="cc">${COUNTRY[c.c]||c.c} · ${fmtPop(c.pop)}</span></div>`).join('');
    box.querySelectorAll('div').forEach(d=>{ d.onmousedown=e=>{e.preventDefault(); choose(list[+d.dataset.i]);}; });
    wrap.appendChild(box);
  };
  input.onkeydown=e=>{
    if(!box) return;
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){
      e.preventDefault(); sel=(sel+(e.key==='ArrowDown'?1:list.length-1))%list.length;
      box.querySelectorAll('div').forEach((d,i)=>d.classList.toggle('sel',i===sel));
      const n=box.children[sel]; if(n) n.scrollIntoView({block:'nearest'});
    } else if(e.key==='Enter'){ e.preventDefault(); choose(list[sel]); }
    else if(e.key==='Escape'){ close(); }
  };
  input.onblur=()=>setTimeout(close,120);
}

/* ============ global controls ============ */
document.getElementById('addring').onclick=addRing;
document.getElementById('unitseg').onclick=e=>{
  const b=e.target.closest('button'); if(!b) return;
  unit=b.dataset.u;
  document.querySelectorAll('#unitseg button').forEach(x=>x.setAttribute('aria-pressed',x===b));
  renderRings(); recompute();
};
document.getElementById('scopeseg').onclick=e=>{
  const b=e.target.closest('button'); if(!b) return;
  capsOnly = b.dataset.s==='caps';
  document.querySelectorAll('#scopeseg button').forEach(x=>x.setAttribute('aria-pressed', x===b));
  document.getElementById('poprow').classList.toggle('off', capsOnly);
  recompute();
};
const POPS=[50000,100000,200000,500000,1000000,2000000,5000000,10000000];
document.getElementById('popslider').oninput=e=>{
  minPop=POPS[+e.target.value];
  document.getElementById('popval').textContent=fmtPop(minPop);
  recompute();
};

document.getElementById('baseseg').onclick=e=>{
  const b=e.target.closest('button'); if(!b) return;
  autoTried=true;                       // an explicit choice turns off auto-switching
  setBasemap(BASEMAPS.findIndex(x=>x.id===b.dataset.b));
};
setBasemap(0);
window.addEventListener('online',()=>{ autoTried=false; setBasemap(baseIdx); });

/* ============ start ============ */
addRing(); addRing();
recompute();
setTimeout(()=>map.invalidateSize(),200);
window.addEventListener('resize',()=>map.invalidateSize());
</script>
